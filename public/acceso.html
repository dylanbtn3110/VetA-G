<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
  <title>Portal VetA-G</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div class="auth">
    <div class="card stack">
      <a href="/" class="brand">🐾 VetA-G</a>
      <div class="tabs" role="tablist">
        <button type="button" data-modo="entrar" aria-selected="true">Iniciar sesión</button>
        <button type="button" data-modo="registro" aria-selected="false">Crear cuenta</button>
      </div>

      <form id="form-entrar" class="form">
        <label>Email <input type="email" name="email" autocomplete="email" required></label>
        <label>Contraseña <input type="password" name="password" autocomplete="current-password" required></label>
        <button class="btn block">Entrar</button>
      </form>

      <form id="form-registro" class="form" hidden>
        <label>Nombre completo <input name="nombre" autocomplete="name" required></label>
        <label>Email <input type="email" name="email" autocomplete="email" required></label>
        <label>Teléfono / WhatsApp <input type="tel" name="telefono" autocomplete="tel"></label>
        <div class="form-grid">
          <label>Documento
            <select name="doc_tipo">
              <option value="1">DNI</option>
              <option value="4">Carné de extranjería</option>
              <option value="7">Pasaporte</option>
              <option value="6">RUC</option>
              <option value="0">Sin documento</option>
            </select>
          </label>
          <label>Número <input name="doc_numero" inputmode="numeric"></label>
        </div>
        <label>Contraseña (mínimo 8) <input type="password" name="password" minlength="8" autocomplete="new-password" required></label>
        <p class="small muted">El documento se usa para emitir tus boletas.</p>
        <button class="btn block">Crear cuenta</button>
      </form>
    </div>
  </div>

  <script src="/assets/api.js"></script>
  <script>
    (() => {
      const formularios = { entrar: document.getElementById('form-entrar'), registro: document.getElementById('form-registro') };
      for (const b of document.querySelectorAll('[data-modo]')) {
        b.addEventListener('click', () => {
          for (const x of document.querySelectorAll('[data-modo]')) x.setAttribute('aria-selected', String(x === b));
          for (const [modo, f] of Object.entries(formularios)) f.hidden = modo !== b.dataset.modo;
        });
      }
      const entrar = async (ruta, form) => {
        const r = await vet.intentar(() => vet.post(ruta, vet.datosForm(form)));
        if (!r) return;
        vet.token.guardar(r.token);
        location.href = r.usuario.rol === 'veterinario' ? '/veterinario.html' : '/cliente.html';
      };
      formularios.entrar.addEventListener('submit', (e) => { e.preventDefault(); entrar('/api/auth/login', e.target); });
      formularios.registro.addEventListener('submit', (e) => { e.preventDefault(); entrar('/api/auth/registro', e.target); });
    })();
  </script>
</body>
</html>
